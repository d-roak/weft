name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          # Both macOS targets build on Apple Silicon runners; the Apple
          # toolchain cross-compiles x86_64 with no extra linker. (Intel
          # macos-13 runners are frequently unavailable.)
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 cross linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }} --bin weft
          cargo build --release --target ${{ matrix.target }} --bin weft-bootstrap
          cargo build --release --target ${{ matrix.target }} --bin weft-relay

      - name: Package
        run: tar -czf weft-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release weft weft-bootstrap weft-relay

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: weft-${{ matrix.target }}.tar.gz

      - name: Upload artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: weft-${{ matrix.target }}
          path: weft-${{ matrix.target }}.tar.gz
